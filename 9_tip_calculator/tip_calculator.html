<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        roboto: ["Roboto"]
                    },
                },
            },
        };
    </script>
</head>

<body>
    <div class="bg-[#f9fbfe] pb-5">
        <img class="w-full" src="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/tip-calculator-img.png" alt="Tip Calculator" />
        <h1 class="text-[#264fa2] font-roboto text-4xl font-medium text-center mt-4 mb-4">
            Tip Calculator
        </h1>
        <div class="flex flex-wrap gap-4 pt-4 justify-center">
            <div class="w-[300px]">
                <p class="text-[#7b8794] font-roboto text-xs font-bold mb-2">BILL AMOUNT</p>
                <input type="text" class="h-10 w-full border border-[#cbd2d9] rounded-md pl-3" id="billAmount" />
            </div>
            <div class="w-[300px]">
                <p class="text-[#7b8794] font-roboto text-xs font-bold mb-2">PERCENTAGE TIP</p>
                <input type="text" class="h-10 w-full border border-[#cbd2d9] rounded-md pl-3" id="percentageTip" />
            </div>
        </div>
        <div class="flex flex-wrap gap-4 pt-4 justify-center">
            <div class="w-[300px]">
                <p class="text-[#7b8794] font-roboto text-xs font-bold mb-2">TIP AMOUNT</p>
                <input type="text" class="h-10 w-full border border-[#cbd2d9] rounded-md pl-3" id="tipAmount" />
            </div>
            <div class="w-[300px]">
                <p class="text-[#7b8794] font-roboto text-xs font-bold mb-2">TOTAL</p>
                <input type="text" class="h-10 w-full border border-[#cbd2d9] rounded-md pl-3" id="totalAmount" />
            </div>
            <div class="w-full text-center mt-4">
                <button onclick="calculateTip()" class="bg-[#264fa2] text-white font-roboto text-lg p-3 rounded-md hover:bg-blue-700" id="calculateButton">
                    CALCULATE
                </button>
                <p class="text-[#cf1124] font-roboto text-sm font-medium mt-2" id="errorMessage"></p>
            </div>
        </div>
    </div>
    <script src="tip_calculator.js"></script>
</body>

</html>
